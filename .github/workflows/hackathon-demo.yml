name: Hackathon demo safety checks
on:
  push:
    branches: [codex/hackathon-fast-track-demo]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  demo-and-regression:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"
      - name: Compile Python
        run: python -m compileall -q .
      - name: Install regression dependencies
        run: python -m pip install -r requirements-security.txt PyYAML==6.0.3 playwright==1.64.1
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Build Pages artifact
        run: python build_pages.py
      - name: Run demo safety and regression suites
        run: python -m unittest -v demo_validation_tests security_tests paypal_rest_tests spend_reservations_tests frontend_tests pages_artifact_tests frontend_browser_tests release_pipeline_tests
      - name: Regenerate synthetic fixture
        run: python main_public.py --output /tmp/hasil-generated.json
