name: System integration regression suite
on:
  pull_request:
    branches: [main]
  push:
    branches: [codex/trustguard-system-audit]
permissions:
  contents: read
jobs:
  integrated-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"
      - name: Compile all Python modules
        run: python -m compileall -q .
      - name: Install test dependencies
        run: python -m pip install -r requirements-security.txt pyyaml playwright
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Build Pages artifact from this checkout
        run: python build_pages.py
      - name: Run complete backend, frontend, artifact, browser, and release tests
        run: python -m unittest -v security_tests paypal_rest_tests frontend_tests pages_artifact_tests frontend_browser_tests release_pipeline_tests
