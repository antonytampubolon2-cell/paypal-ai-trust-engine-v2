name: Backend security and PayPal REST schema tests
on:
  pull_request:
    branches: [codex/security-hardening]
  push:
    branches: [codex/stage-5-3-backend-security]
permissions:
  contents: read
jobs:
  backend-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install security dependencies
        run: python -m pip install -r requirements-security.txt
      - name: Test security primitives and dispatcher
        run: python -m unittest -v security_tests
      - name: Test PayPal REST item schema and amount binding
        run: python -m unittest -v paypal_rest_tests
