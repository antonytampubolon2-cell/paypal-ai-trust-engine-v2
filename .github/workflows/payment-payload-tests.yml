name: PayPal Orders v2 payload regression tests
on:
  push:
    branches: [submission-prep]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  payload-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Compile Python modules
        run: python -m compileall -q .
      - name: Install test dependencies
        run: python -m pip install -r requirements.txt
      - name: Run mock-only Orders v2 payload tests
        run: python -m unittest -v payment_payload_tests
