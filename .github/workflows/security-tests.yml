name: Security tests
on:
  pull_request:
    branches: [main]
  push:
    branches: [codex/security-hardening]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Compile Python modules
        run: python -m compileall -q .
      - run: python -m pip install -r requirements-security.txt
      - run: python -m unittest -v security_tests
