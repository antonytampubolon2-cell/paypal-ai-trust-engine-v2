name: Security tests
on:
  pull_request:
    branches: [main]
  push:
    branches: [codex/security-hardening]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Compile Python modules
        run: python -m compileall -q .
      - run: python -m pip install -r requirements-security.txt
      - run: python -m unittest -v security_tests

      - name: PayPal REST item schema tests
        run: python -m unittest -v paypal_rest_tests
