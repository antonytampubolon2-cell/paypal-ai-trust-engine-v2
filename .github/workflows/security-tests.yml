name: Security tests
on:
  pull_request:
    branches: [main, codex/security-hardening]
  push:
    branches: [codex/security-hardening, codex/frontend-hardening]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-security.txt
      - run: python -m unittest -v security_tests frontend_tests
