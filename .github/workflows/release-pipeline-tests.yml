name: Release pipeline structure tests
on:
  pull_request:
    branches: [codex/stage-5-3-dashboard-repair]
  push:
    branches: [codex/stage-5-3-release-pipeline-final]
permissions:
  contents: read
jobs:
  release-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install pyyaml playwright
      - name: Install Chromium for artifact/browser tests
        run: python -m playwright install --with-deps chromium
      - name: Build exact artifact
        run: python build_pages.py
      - name: Validate release gates
        run: python -m unittest -v release_pipeline_tests
      - name: Validate Pages artifact
        run: python -m unittest -v pages_artifact_tests
      - name: Validate dashboard behavior
        run: python -m unittest -v frontend_browser_tests
